org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Server release carried inside the APK, so the app can install a server that
# cannot reach GitHub.  Downloaded at build time by :app:fetchServerRelease and
# verified against the release's own SHA256SUMS; never committed.  Bump this
# when a new server release should ship with the app.
sozvonServerVersion=v0.2.1
sozvonServerRepo=leyvanah/sozvon
