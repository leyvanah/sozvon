<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Change password</title>
    <meta charset="utf-8">
    <!-- Decides light vs dark before the first paint; must stay a blocking
         script in the head, ahead of the stylesheets.  Not to be confused
         with the deployment theme hook in static/theme/. -->
    <script src="/theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Deployment theme hook: repointed to the theme's icon; a no-op copy
         the SOZVON micro icon ships in the stock distribution (see static/theme/favicon.svg). -->
    <link rel="icon" type="image/svg+xml" href="/theme/favicon.svg"/>
    <link rel="stylesheet" href="/common.css">
    <link rel="stylesheet" href="/change-password.css">
    <link rel="stylesheet" type="text/css" href="/galene.css"/>
    <link rel="author" href="https://www.irif.fr/~jch/"/>
    <!-- Deployment theme hook: loaded last so its rules win the cascade.
         Empty in the stock distribution; see static/theme/theme.css. -->
    <link rel="stylesheet" type="text/css" href="/theme/theme.css"/>
  </head>

  <body>

    <h1 id="title" class="navbar-brand">Change password</h1>

    <form id="passwordform">
      <label for="old">Old password:</label>
      <input id="old" type="password"/>
      <label for="new1">New password:</label>
      <input id="new1" type="password"/>
      <label for="new2">New password (repeat):</label>
      <input id="new2" type="password"/>
      <input type="submit" value="Submit"/>
    </form>

    <p id="message"></p>

    <p id="errormessage"></p>

    <!-- Deployment theme hook: a no-op in the stock distribution.  This page
         does not load i18n.js, so only the branding half of the API applies. -->
    <script src="/theme/theme.js" defer></script>
    <script src="/management.js" defer></script>
    <script src="/change-password.js" defer></script>
  </body>
</html>
