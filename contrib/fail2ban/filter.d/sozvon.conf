# Fail2ban filter for Sozvon (https://github.com/leyvanah/sozvon).
#
# Matches the per-attempt failure lines that the server logs for every
# authentication surface (group join, /recordings/, admin API), plus the
# line logged when the built-in throttle bans an address itself.
#
# Copy to /etc/fail2ban/filter.d/sozvon.conf.

[Definition]

failregex = Failed login from <HOST> \(
            Too many failed logins from <HOST>,

journalmatch = _SYSTEMD_UNIT=sozvon.service
