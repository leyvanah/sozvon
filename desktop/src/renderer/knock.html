<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>SOZVON</title>
  <style>
    /*
     * The client's palette again (see renderer/launcher.html for why it is
     * restated rather than shared): this window is served from the
     * filesystem and never sees the server's stylesheets.  Dark is the base;
     * the light half arrives through prefers-color-scheme, which Electron
     * drives from nativeTheme -- so the notification matches whatever the
     * user chose in the client, with no script here.
     */
    :root {
      color-scheme: dark;
      --surface: #0A0A0A;
      --text: #FFFFFF;
      --text-2: #BDBDBD;
      --text-3: #8A8A8A;
      --accent: #FFFFFF;
      --accent-contrast: #000000;
      --accent-hover: #D6D6D6;
      --border: #444444;
      --divider: rgba(255, 255, 255, 0.10);
      --hover: rgba(255, 255, 255, 0.06);
      --shadow: 0 18px 44px -12px rgba(0, 0, 0, 0.75);
      --radius: 8px;
      --radius-lg: 12px;
      --font: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --surface: #FFFFFF;
        --text: #000000;
        --text-2: #444444;
        --text-3: #767676;
        --accent: #000000;
        --accent-contrast: #FFFFFF;
        --accent-hover: #333333;
        --border: #BDBDBD;
        --divider: rgba(0, 0, 0, 0.12);
        --hover: rgba(0, 0, 0, 0.05);
        --shadow: 0 18px 44px -12px rgba(0, 0, 0, 0.28);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      /* The window itself is transparent: the rounded card below is the
         whole of what is seen, and a body background would square it off. */
      background: transparent;
      font-family: var(--font);
      /* Nothing here scrolls; the window is resized to the content instead. */
      overflow: hidden;
      user-select: none;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--divider);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 14px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .head {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .kicker {
      flex: 1;
      font-size: 11px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--text-3);
    }
    .close {
      flex: none;
      width: 20px;
      height: 20px;
      line-height: 18px;
      padding: 0;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-3);
      font-family: var(--font);
      font-size: 15px;
      cursor: pointer;
    }
    .close:hover { background: var(--hover); color: var(--text); }
    .text {
      margin: 0;
      font-size: 14px;
      line-height: 1.35;
      color: var(--text);
      /* A long name wraps rather than stretching the window off-screen. */
      overflow-wrap: anywhere;
    }
    .actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    button.action {
      font-family: var(--font);
      font-size: 13px;
      padding: 7px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
    }
    button.action:hover { background: var(--hover); color: var(--text); }
    button.action.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-contrast);
      font-weight: 600;
    }
    button.action.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    button.action:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="head">
      <span class="kicker" id="kicker">Стучатся в комнату</span>
      <button class="close" id="close" type="button"
              title="Убрать уведомление" aria-label="Убрать уведомление">×</button>
    </div>
    <p class="text" id="text"></p>
    <div class="actions" id="actions"></div>
  </div>
  <script src="knock.js"></script>
</body>
</html>
