name: Release

on:
  push:
    tags: ['v*']
  # Lets a release be rehearsed without tagging: it builds and uploads the
  # artefacts to the run, but creates no GitHub release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp into the dry-run build'
        required: false
        # Not 0.0.0: the APK's versionCode is computed from this, and Android
        # refuses a versionCode of 0, so that default failed every dry run.
        default: 'v0.0.1-dryrun'

permissions:
  contents: write

jobs:
  # The desktop app's installers, one runner per platform, because
  # electron-builder makes an NSIS installer only on Windows and a .dmg only
  # on macOS.  The release job below waits for all three and publishes them
  # with everything else, so there is still exactly one place that creates the
  # release and one SHA256SUMS.
  #
  # Every installer gets a fixed name, like sozvon.apk's, so that
  # releases/latest/download/<name> is a permanent link the website and the
  # README can point at:
  #
  #   sozvon-setup.exe               Windows x64
  #   sozvon-mac-arm64.dmg           macOS, Apple silicon
  #   sozvon-mac-x64.dmg             macOS, Intel
  #   sozvon-linux-amd64.deb         Debian, Ubuntu and their relatives
  #   sozvon-linux-x86_64.AppImage   any other x86-64 Linux
  desktop:
    name: Build the ${{ matrix.name }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows
          - name: macOS
            os: macos-latest
            platform: mac
          - name: Linux
            os: ubuntu-latest
            platform: linux
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The installer carries the release's version, not whatever
      # desktop/package.json last said: an app that reports a different
      # version from the release it was downloaded from is a support case
      # nobody can reproduce.  Semver has no leading "v".
      - name: Determine version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              version="${GITHUB_REF_NAME}"
          else
              version="${{ inputs.version }}"
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci
        working-directory: desktop

      # Counted before they are run, as in CI: `node --test` on a mask that
      # matches nothing passes with nothing checked.
      - name: Test
        working-directory: desktop
        run: |
          n=0
          for f in test/*.test.js; do
              [ -f "$f" ] && n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
              echo "no tests in desktop/test/ -- this step would have passed vacuously" >&2
              exit 1
          fi
          node --test 'test/*.test.js'

      # --publish never: electron-builder publishes to GitHub on its own when
      # it sees a tag and a token, which would race the release job for the
      # same release.  It only builds here.
      #
      # Unsigned, for want of certificates: Windows SmartScreen warns on first
      # run, and macOS Gatekeeper refuses to open the app until it is allowed
      # in System Settings.  Auto-discovery is off so that the build cannot
      # pick up some certificate the runner happens to have.  The macOS app is
      # still ad-hoc signed (mac.identity "-" in package.json): Apple silicon
      # runs no unsigned code at all, and an app without even that signature
      # is reported as "damaged" rather than merely unverified.
      - name: Build the installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VERSION: ${{ steps.v.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          rm -rf dist
          case "$PLATFORM" in
          windows)
              npm run dist -- --win nsis --x64 --publish never \
                  -c.extraMetadata.version="$VERSION" \
                  -c.nsis.artifactName=sozvon-setup.exe
              expect="sozvon-setup.exe" ;;
          mac)
              npm run dist -- --mac dmg --arm64 --x64 --publish never \
                  -c.extraMetadata.version="$VERSION" \
                  -c.dmg.artifactName='sozvon-mac-${arch}.dmg'
              expect="sozvon-mac-arm64.dmg sozvon-mac-x64.dmg" ;;
          linux)
              npm run dist -- --linux AppImage deb --x64 --publish never \
                  -c.extraMetadata.version="$VERSION" \
                  -c.appImage.artifactName=sozvon-linux-x86_64.AppImage \
                  -c.deb.artifactName=sozvon-linux-amd64.deb
              expect="sozvon-linux-amd64.deb sozvon-linux-x86_64.AppImage" ;;
          esac
          ls -l dist

          # Every installer must be there, and a real one -- not a stub left
          # by a step that quietly did nothing.  Only these are uploaded, not
          # the blockmaps and unpacked trees beside them.
          mkdir -p out
          for f in $expect; do
              if [ ! -f "dist/$f" ]; then
                  echo "electron-builder did not produce dist/$f" >&2
                  exit 1
              fi
              size=$(wc -c < "dist/$f")
              if [ "$size" -lt 50000000 ]; then
                  echo "dist/$f is only $size bytes; an Electron installer is ~100 MB" >&2
                  exit 1
              fi
              cp "dist/$f" out/
          done

      # Install or unpack what was just built and start it, the way a person
      # would, in smoke-test mode (desktop/scripts/smoke.sh).  A screenshot of
      # each start goes to the run's artefacts for a person to look at.
      - name: Start the installed app (Windows)
        if: matrix.platform == 'windows'
        working-directory: desktop
        run: |
          set -eu
          # Per-user and silent.  Start-Process -Wait, because the installer
          # otherwise returns before it has finished copying.
          powershell -NoProfile -Command \
              "Start-Process -FilePath 'out\sozvon-setup.exe' -ArgumentList '/S' -Wait"
          app="$LOCALAPPDATA/Programs/sozvon-desktop/Sozvon.exe"
          test -f "$app"
          SMOKE_SHOT="$PWD/out/shot-windows.png" scripts/smoke.sh "$app"

      - name: Start the installed app (macOS)
        if: matrix.platform == 'mac'
        working-directory: desktop
        run: |
          set -eu
          for arch in arm64 x64; do
              mnt=$(mktemp -d)
              hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "out/sozvon-mac-$arch.dmg"
              app="/tmp/Sozvon-$arch.app"
              rm -rf "$app"
              ditto "$mnt/Sozvon.app" "$app"
              hdiutil detach "$mnt"

              # The ad-hoc signature has to be there and intact (see the build
              # step), the binary has to be the architecture it is named for,
              # and macOS kills an app that touches the camera without saying
              # why it wants it.
              codesign --verify --deep --strict --verbose=2 "$app"
              codesign -dv "$app" 2>&1 | tee sig.txt
              grep -q 'Signature=adhoc' sig.txt
              lipo -archs "$app/Contents/MacOS/Sozvon" | tee archs.txt
              want=$arch
              [ "$arch" = x64 ] && want=x86_64
              grep -qw "$want" archs.txt
              /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$app/Contents/Info.plist"
              /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"

              # The runner is Apple silicon: the Intel build starts through
              # Rosetta.  Said out loud when it cannot, rather than skipped.
              if [ "$arch" = x64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
                  echo "::warning::no Rosetta on this runner; the Intel build was checked but not started"
                  continue
              fi
              SMOKE_SHOT="$PWD/out/shot-mac-$arch.png" scripts/smoke.sh "$app/Contents/MacOS/Sozvon"
          done

      - name: Start the installed app (Linux)
        if: matrix.platform == 'linux'
        working-directory: desktop
        run: |
          set -eu
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb imagemagick libfuse2t64
          echo "apparmor_restrict_unprivileged_userns: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"

          # The .deb, installed the way the release notes say to.
          sudo apt-get install -y -q "$PWD/out/sozvon-linux-amd64.deb"
          ls -l /etc/apparmor.d/sozvon-desktop 2>/dev/null || echo "no AppArmor profile installed"
          SMOKE_SHOT="$PWD/out/shot-linux-deb.png" \
              xvfb-run -a -s '-screen 0 1280x800x24' scripts/smoke.sh sozvon-desktop

          # The AppImage, as downloaded and made executable.
          chmod +x out/sozvon-linux-x86_64.AppImage
          SMOKE_SHOT="$PWD/out/shot-linux-appimage.png" \
              xvfb-run -a -s '-screen 0 1280x800x24' scripts/smoke.sh out/sozvon-linux-x86_64.AppImage

          # Removing the package must leave nothing of ours in /etc.
          sudo apt-get remove -y -q sozvon-desktop
          if [ -e /etc/apparmor.d/sozvon-desktop ]; then
              echo "the AppArmor profile survived removing the package" >&2
              exit 1
          fi

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots-${{ matrix.platform }}
          path: desktop/out/shot-*.png
          if-no-files-found: warn

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-${{ matrix.platform }}
          path: |
            desktop/out/*.exe
            desktop/out/*.dmg
            desktop/out/*.deb
            desktop/out/*.AppImage
          if-no-files-found: error

  release:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4

      # Deliberately the current toolchain rather than go-version-file: the
      # go directive states the *minimum* language version, and building a
      # release with exactly that minimum ships whatever standard-library
      # vulnerabilities have been fixed since.  These binaries run as a
      # service on other people's servers; CI still checks the declared
      # minimum compiles.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # For the Android app, which ships as an asset of the release: see the
      # "Build the Android app" step below.  Its debug-signed counterpart is
      # built on every push that touches android/ by
      # .github/workflows/android-apk.yml.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Never ship a release that does not pass what CI asks of every commit.
      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: "0"

      - name: Determine version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
              echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # The server reads its web client from disk (static/ is not embedded),
      # so an archive -- not a bare binary -- is the unit of distribution.
      # contrib/install.sh relies on exactly this layout.
      - name: Build archives
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
              GOOS=${target%/*}
              GOARCH=${target#*/}
              name="sozvon_${VERSION}_${GOOS}_${GOARCH}"
              ext=""
              [ "$GOOS" = "windows" ] && ext=".exe"

              echo "==> $name"
              rm -rf "build/$name"
              mkdir -p "build/$name"

              # -trimpath keeps absolute build paths out of the binary, so the
              # same source at the same version builds to the same bytes.
              env GOOS="$GOOS" GOARCH="$GOARCH" go build \
                  -trimpath \
                  -ldflags "-s -w -X main.version=${VERSION}" \
                  -o "build/$name/sozvon${ext}" .
              env GOOS="$GOOS" GOARCH="$GOARCH" go build \
                  -trimpath \
                  -ldflags "-s -w" \
                  -o "build/$name/galenectl${ext}" ./galenectl

              cp -r static "build/$name/static"
              cp -r contrib "build/$name/contrib"

              # LICENCE must be there -- shipping without it is a licence
              # violation, so let the build fail loudly if it is missing.
              cp LICENCE README.md "build/$name/"
              # The rest are documentation: a release should not fail because
              # one of them was renamed or has not landed on this branch yet.
              for doc in README.ru.md FORK-CHANGES.md SECURITY.md CONTRIBUTING.md \
                         galene-install.md galene.md galene-api.md; do
                  if [ -f "$doc" ]; then
                      cp "$doc" "build/$name/"
                  else
                      echo "note: $doc not present, omitted from $name" >&2
                  fi
              done

              if [ "$GOOS" = "windows" ]; then
                  (cd build && zip -qr "../dist/$name.zip" "$name")
              else
                  tar -czf "dist/$name.tar.gz" -C build "$name"
              fi
          done

          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      # The APK carries the server release inside it (so it can install a
      # server that cannot reach GitHub), and it is built from dist/ rather
      # than from GitHub: the release it belongs to does not exist yet at this
      # point, and an APK that installs a different version than the release
      # it shipped in is a support case nobody can reproduce.
      #
      # Signed with the project's stable key, taken from the repository's
      # secrets: Android treats a differently signed build as a different app
      # and refuses to install it over an existing one, so a release signed
      # with anything else -- CI's per-run debug key above all -- would cost
      # every user an uninstall, and their saved servers with it.
      - name: Build the Android app
        env:
          VERSION: ${{ steps.v.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.SOZVON_KEYSTORE_BASE64 }}
          SOZVON_KEYSTORE_PASSWORD: ${{ secrets.SOZVON_KEYSTORE_PASSWORD }}
          # Not from a secret, deliberately.  GitHub redacts every secret
          # VALUE it finds in a log, and this one is the word "sozvon" --
          # which turned every archive name, path and task name in the
          # release log into "***" and made the log useless for working out
          # what a failed release actually did.  The alias names a key inside
          # a keystore nobody else has; it protects nothing.  A repository
          # whose keystore uses a different alias can still set the secret,
          # and it wins here.
          SOZVON_KEY_ALIAS: ${{ secrets.SOZVON_KEY_ALIAS || 'sozvon' }}
          SOZVON_KEY_PASSWORD: ${{ secrets.SOZVON_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
              echo "SOZVON_KEYSTORE_BASE64 is not set for this repository." >&2
              echo "The release APK must be signed with the stable key -- see" >&2
              echo "the Signing section of android/README.md." >&2
              exit 1
          fi
          # $RUNNER_TEMP is scoped to this job and is never uploaded anywhere.
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SOZVON_KEYSTORE="$RUNNER_TEMP/release.jks"

          gradle -p android assembleRelease --no-daemon \
              -PsozvonServerVersion="$VERSION" \
              -PsozvonServerDir="$PWD/dist" \
              -PsozvonVersionName="$VERSION"
          rm -f "$RUNNER_TEMP/release.jks"

          apk=android/app/build/outputs/apk/release/app-release.apk
          # The build leaves the APK unsigned rather than falling back to a
          # debug key when the credentials are missing, and an unsigned APK
          # cannot be installed at all -- so prove it was signed before it
          # becomes a release asset.  The certificate printed here is also
          # what an update has to match: a different one, and every existing
          # install has to be removed by hand before it can upgrade.
          sdk=${ANDROID_SDK_ROOT:-${ANDROID_HOME:?no Android SDK on this runner}}
          apksigner=$(ls -d "$sdk"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"

          # A fixed asset name on purpose: it makes
          # releases/latest/download/sozvon.apk a permanent link that a person
          # can be sent, that contrib/install.sh fetches by exactly this name,
          # and that the GitHub-release app stores follow.
          cp "$apk" dist/sozvon.apk

      # After the APK, not before: the APK embeds dist/ (see above), and the
      # desktop installers have no business inside it.
      - name: Add the desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-installer-*
          merge-multiple: true
          path: dist

      # Re-made now that the APK and the desktop installers are in dist/ as
      # well; the copy embedded in the APK covers only the server archives,
      # which is all the installer looks up there.
      - name: Checksum everything
        run: |
          set -eu
          for f in sozvon-setup.exe sozvon-mac-arm64.dmg sozvon-mac-x64.dmg \
                   sozvon-linux-amd64.deb sozvon-linux-x86_64.AppImage; do
              test -f "dist/$f" || { echo "missing dist/$f" >&2; exit 1; }
          done
          (cd dist && rm -f SHA256SUMS && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
          ls -l dist

      - name: Upload artefacts to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: sozvon-release-${{ steps.v.outputs.version }}
          path: dist/

      - name: Write the release notes
        if: github.ref_type == 'tag'
        run: |
          {
            echo 'Verify a download before running it:'
            echo
            echo '```sh'
            echo 'sha256sum -c SHA256SUMS --ignore-missing'
            echo '```'
            echo
            echo 'Each archive contains the `sozvon` server, the `galenectl` admin'
            echo 'tool, the `static/` web client the server serves at runtime,'
            echo 'sample systemd and fail2ban configuration under `contrib/`, and'
            echo 'the documentation.'
            echo
            echo '`sozvon.apk` is the Android app, for phones and tablets. It is'
            echo 'installed from the file rather than from a store, so Android will'
            echo 'ask you to allow installing from this source. The server the'
            echo 'installer sets up offers the same app for download on its login'
            echo 'page.'
            echo
            echo 'The desktop app, for calls and for setting up a server on a VPS.'
            echo 'None of its installers is code-signed yet; check the file against'
            echo '`SHA256SUMS` first if that makes you hesitate -- it should.'
            echo
            echo '- **Windows:** `sozvon-setup.exe`. On first run SmartScreen says it'
            echo '  "protected your PC": choose "More info", then "Run anyway".'
            echo '- **macOS:** `sozvon-mac-arm64.dmg` for Apple silicon (M1 and later),'
            echo '  `sozvon-mac-x64.dmg` for Intel. Drag Sozvon to Applications. The'
            echo '  first time it is opened macOS refuses; open System Settings ->'
            echo '  Privacy & Security, choose "Open Anyway" next to Sozvon and confirm.'
            echo '- **Linux:** `sozvon-linux-amd64.deb` for Debian, Ubuntu and their'
            echo '  relatives: `sudo apt install ./sozvon-linux-amd64.deb`. Elsewhere,'
            echo '  `sozvon-linux-x86_64.AppImage`: make it executable and run it.'
            echo
            echo 'The `windows_amd64`, `darwin_*` and `linux_*` archives are the server,'
            echo 'not the app.'
            echo
            echo 'To install on a fresh Debian or Ubuntu VPS, see `contrib/install.sh`.'
          } > release-notes.md

      # Uses the gh CLI rather than a third-party action: one less external
      # dependency in the path that produces the binaries people will run.
      # --generate-notes appends the autogenerated changelog below our text.
      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "$VERSION" dist/* \
              --title "Sozvon $VERSION" \
              --notes-file release-notes.md \
              --generate-notes
