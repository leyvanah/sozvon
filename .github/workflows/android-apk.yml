name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      # The APK embeds the installer and the server release, so a change to
      # either one changes the app even though nothing under android/ moved.
      # A fix to install.sh that never reached a build is exactly how a stale
      # installer shipped once before.
      - 'contrib/install.sh'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # A debug-signed APK installs fine on any device ("unknown sources");
      # for store-grade distribution set up a release keystore instead, see
      # android/README.md.
      - name: Build debug APK
        run: gradle -p android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sozvon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
