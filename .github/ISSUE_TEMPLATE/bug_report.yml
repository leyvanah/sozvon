name: Bug report
description: Something in Sozvon does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if the problem is in the **SFU core** (media routing,
        codecs, RTP, the client protocol), it is most likely an upstream
        [Galène](https://github.com/jech/galene) bug and is best reported
        there. See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).

        **Do not report security vulnerabilities here** — use the Security tab,
        see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        If a call is involved, say how many participants there were and who was
        doing what — a lot of behaviour here depends on that.
      placeholder: |
        1. Two participants join a group with "e2ee": true
        2. The second one turns their camera on
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Commit hash or build date of the server you are running.
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where does it happen
      multiple: true
      options:
        - Web client (desktop browser)
        - Web client (mobile browser)
        - Android app
        - Server / command line
        - Operator dashboard
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      description: For client-side problems. Include the device if it is a phone or tablet.
      placeholder: Firefox 140 on Debian 13; Chrome on Android 14, Pixel 7

  - type: textarea
    id: config
    attributes:
      label: Relevant group configuration
      description: |
        The group's JSON with any passwords, tokens and hostnames removed —
        whether `lobby`, `e2ee`, `require-e2ee` or `operator-room` are set often
        decides the answer.
      render: json

  - type: textarea
    id: logs
    attributes:
      label: Server log and browser console
      description: |
        Anything the server printed and anything in the browser's developer
        console. Please remove addresses, tokens and passwords first.
      render: shell
