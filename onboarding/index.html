<!DOCTYPE html>
<!--
  The first-run onboarding of the Sozvon apps (Android and desktop).  Shown
  from the device, so nothing here may reach the network: every check that
  needs it is asked of the app through host.js.  See onboarding/README.md.

  Sozvon is a fork of Galène (MIT); see LICENCE.
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>SOZVON</title>
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <button class="icon-btn" id="back" type="button" hidden></button>
      <div class="progress" id="progress" role="progressbar" hidden></div>
      <button class="text-btn" id="skip" type="button" hidden></button>
    </header>
    <main class="stage" id="stage"></main>
    <div class="sr-only" id="announce" aria-live="polite"></div>
  </div>

  <script src="i18n.js"></script>
  <script src="flow.js"></script>
  <script src="host.js"></script>
  <script src="app.js"></script>
</body>
</html>
